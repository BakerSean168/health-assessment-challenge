services:
  migrate:
    image: ${MIGRATOR_IMAGE:?set MIGRATOR_IMAGE}
    restart: "no"
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      NODE_OPTIONS: --max-old-space-size=160
    mem_limit: 256m
    networks:
      - shared-edge

  app:
    image: ${APP_IMAGE:?set APP_IMAGE}
    restart: unless-stopped
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-4}
      NODE_OPTIONS: --max-old-space-size=256
    expose:
      - "3000"
    mem_limit: 384m
    networks:
      shared-edge:
        aliases:
          - health-assessment
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('node:http').get('http://127.0.0.1:3000/', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  shared-edge:
    external: true
    name: ${SHARED_DOCKER_NETWORK:-memoflow_memoflow-network}
